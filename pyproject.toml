[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lazysort"
version = "0.1.0"
description = "A local-first AI file organizer"
requires-python = ">=3.11"
dependencies = [
    "PyMuPDF>=1.24,<2",
    "streamlit>=1.38,<2",
    "llama-cpp-python==0.2.90",
    "numpy<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
watch = ["watchdog>=5,<7"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
